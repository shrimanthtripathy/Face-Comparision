name: android-apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Nodal-android.apk
      - uses: actions/upload-artifact@v4
        with: {name: Nodal-android, path: Nodal-android.apk}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: Nodal-android.apk}
